<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Battle - Adu Layang-Layang</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #6ec6ff 0%, #b3e5fc 70%, #a5d6a7 100%);
    touch-action: none;
  }

  /* ===== INTRO SCREEN ===== */
  #introScreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: white;
    text-align: center;
    padding: 20px;
  }
  #introScreen.hidden { display: none; }

  .intro-kite {
    font-size: 80px;
    margin-bottom: 20px;
    opacity: 0;
    animation: kiteIn 0.8s ease-out 0.2s forwards;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7));
  }
  @keyframes kiteIn {
    0%   { opacity: 0; transform: translateY(-40px) rotate(-20deg) scale(0.5); }
    100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
  }

  .intro-title {
    font-size: 32px;
    font-weight: bold;
    color: #FFD700;
    letter-spacing: 4px;
    margin-bottom: 15px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.8s forwards;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
  }

  .intro-sub {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 2px;
    margin-bottom: 15px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1.4s forwards;
  }

  .intro-highscore {
    font-size: 13px;
    color: #FFD700;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1.6s forwards;
  }

  .intro-credit {
    position: absolute;
    bottom: 60px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 2s forwards;
  }
  .intro-credit .label {
    display: block;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .intro-credit .names {
    font-size: 16px;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  }

  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .intro-start {
    margin-top: 20px;
    padding: 14px 36px;
    font-size: 16px;
    background: #FFD700;
    color: #333;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 2.6s forwards;
    box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
  }
  .intro-start:active { transform: scale(0.96); }

  /* HUD */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-weight: bold;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  #hud.visible { opacity: 1; }
  .hud-box {
    background: rgba(0,0,0,0.5);
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .player-hud { border-left: 4px solid #2196F3; }
  .enemy-hud  { border-right: 4px solid #F44336; text-align: right; }
  .hp-bar {
    width: 110px;
    height: 8px;
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
    margin-top: 4px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    transition: width 0.2s;
  }
  .player-hud .hp-fill { background: #2196F3; }
  .enemy-hud .hp-fill  { background: #F44336; }

  /* HUD TENGAH - SKOR */
  #scoreHud {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: bold;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
    min-width: 120px;
  }
  #scoreHud.visible { opacity: 1; }
  #scoreHud .score-value {
    font-size: 20px;
    color: #FFD700;
    display: block;
    line-height: 1.1;
  }
  #scoreHud .score-label {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 2px;
  }
  #scoreHud .wave-info {
    font-size: 10px;
    color: #90CAF9;
    margin-top: 2px;
  }

  /* Floating text (skor naik) */
  .floating-score {
    position: absolute;
    color: #FFD700;
    font-weight: bold;
    font-size: 20px;
    pointer-events: none;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    z-index: 6;
    animation: floatScore 1s ease-out forwards;
  }
  @keyframes floatScore {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    30%  { opacity: 1; transform: translateY(-10px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(1); }
  }

  /* Game Over Overlay */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  #overlay.visible { display: flex; }
  #overlay h1 { font-size: 32px; margin-bottom: 12px; color: #FFD700; }
  #overlay p { margin-bottom: 20px; font-size: 15px; line-height: 1.7; max-width: 400px; }
  #overlay .final-score {
    font-size: 36px;
    color: #FFD700;
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
  #overlay .new-record {
    color: #4CAF50;
    font-size: 14px;
    margin-bottom: 15px;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  #overlay button {
    padding: 12px 28px;
    font-size: 16px;
    background: #FFD700;
    color: #333;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay button:active { transform: scale(0.96); }

  /* Kontrol bawah */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 0 20px;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  #controls.visible { opacity: 1; }
  .ctrl-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.6);
    color: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    font-weight: bold;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.5); }

  .hint {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  .hint.visible { opacity: 1; }

  /* Wave notification */
  #waveNotif {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #FFD700;
    font-size: 40px;
    font-weight: bold;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.5);
    pointer-events: none;
    opacity: 0;
    z-index: 8;
    letter-spacing: 4px;
  }
  #waveNotif.show {
    animation: waveShow 1.8s ease-out;
  }
  @keyframes waveShow {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  }

  @media (max-width: 600px) {
    .intro-title { font-size: 24px; letter-spacing: 2px; }
    .intro-kite { font-size: 65px; }
    #overlay h1 { font-size: 24px; }
    #overlay p { font-size: 13px; }
    #overlay .final-score { font-size: 28px; }
    #waveNotif { font-size: 30px; }
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game"></canvas>

  <!-- ===== INTRO SCREEN ===== -->
  <div id="introScreen">
    <div class="intro-kite">🪁</div>
    <div class="intro-title">KITE BATTLE</div>
    <div class="intro-sub">Adu Layang-Layang</div>
    <div class="intro-highscore" id="introHighscore"></div>
    <button class="intro-start" id="startBtn">MULAI PERMAINAN</button>
    <div class="intro-credit">
      <span class="label">— CREATED BY —</span>
      <span class="names">Rinaldi, Dani G, Aliamsyah</span>
    </div>
  </div>

  <!-- HUD PLAYER -->
  <div id="hud">
    <div class="hud-box player-hud">
      🪁 KAMU
      <div class="hp-bar"><div class="hp-fill" id="playerHp"></div></div>
    </div>
    <div class="hud-box enemy-hud">
      MUSUH 🪁
      <div class="hp-bar"><div class="hp-fill" id="enemyHp"></div></div>
    </div>
  </div>

  <!-- HUD SKOR -->
  <div id="scoreHud">
    <span class="score-label">SKOR</span>
    <span class="score-value" id="scoreValue">0</span>
    <div class="wave-info" id="waveInfo">Wave 1 • Musuh: 4</div>
  </div>

  <div class="hint" id="hint">Geser / sentuh untuk mengarahkan layanganmu</div>

  <div id="controls">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>

  <!-- Wave notification -->
  <div id="waveNotif"></div>

  <!-- Game Over Overlay -->
  <div id="overlay">
    <h1>🪁 GAME OVER 🪁</h1>
    <p>Skor akhir kamu:</p>
    <div class="final-score" id="finalScore">0</div>
    <div class="new-record" id="newRecord" style="display:none;">🎉 REKOR BARU! 🎉</div>
    <p id="overlayMsg"></p>
    <button id="restartBtn">MAIN LAGI</button>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var introScreen = document.getElementById('introScreen');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var playerHpEl = document.getElementById('playerHp');
  var enemyHpEl = document.getElementById('enemyHp');
  var hud = document.getElementById('hud');
  var scoreHud = document.getElementById('scoreHud');
  var scoreValueEl = document.getElementById('scoreValue');
  var waveInfoEl = document.getElementById('waveInfo');
  var finalScoreEl = document.getElementById('finalScore');
  var newRecordEl = document.getElementById('newRecord');
  var overlayMsg = document.getElementById('overlayMsg');
  var introHighscore = document.getElementById('introHighscore');
  var controls = document.getElementById('controls');
  var hint = document.getElementById('hint');
  var waveNotif = document.getElementById('waveNotif');
  var gameContainer = document.getElementById('gameContainer');

  var W = 0, H = 0;
  var dpr = window.devicePixelRatio || 1;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function() {
    resize();
    if (running) render();
  });
  resize();

  var running = false;
  var lastTime = 0;
  var particles = [];
  var shakeTime = 0;

  // High score
  var highScore = 0;
  try { highScore = parseInt(localStorage.getItem('kiteBattleHighScore') || '0', 10) || 0; } catch(e) { highScore = 0; }

  if (highScore > 0) {
    introHighscore.textContent = '🏆 Rekor tertinggi: ' + highScore;
  }

  // Player
  var player = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, angle: 0 };

  // Enemies (array)
  var enemies = [];

  // Score & Wave
  var score = 0;
  var wave = 1;
  var enemiesKilled = 0;

  var arena = { margin: 40 };

  // Warna musuh
  var ENEMY_COLORS = [
    { body1: '#EF5350', body2: '#B71C1C', stroke: '#7f0000', name: 'merah' },
    { body1: '#AB47BC', body2: '#6A1B9A', stroke: '#4A148C', name: 'ungu' },
    { body1: '#FF9800', body2: '#E65100', stroke: '#BF360C', name: 'oranye' },
    { body1: '#26A69A', body2: '#00695C', stroke: '#004D40', name: 'teal' },
    { body1: '#EC407A', body2: '#AD1457', stroke: '#880E4F', name: 'pink' },
    { body1: '#5C6BC0', body2: '#283593', stroke: '#1A237E', name: 'indigo' }
  ];

  function createEnemy(waveNum, index) {
    var color = ENEMY_COLORS[index % ENEMY_COLORS.length];
    // HP menyesuaikan wave: wave 1 = 30 HP, naik 15 per wave
    var maxHp = 30 + (waveNum - 1) * 15;
    // Kecepatan menyesuaikan wave
    var speed = 200 + (waveNum - 1) * 30;

    var x, y;
    // Muncul di area atas
    x = 80 + Math.random() * (W - 160);
    y = 80 + Math.random() * 120;

    return {
      x: x, y: y,
      vx: 0, vy: 0,
      hp: maxHp, maxHp: maxHp,
      angle: 0,
      aiTimer: 0,
      targetX: x, targetY: y,
      color: color,
      speed: speed,
      size: 22,
      hitFlash: 0
    };
  }

  function spawnWave(waveNum) {
    enemies = [];
    // Jumlah musuh bertambah tiap wave
    var count = 3 + waveNum; // wave 1: 4 musuh, wave 2: 5, dst
    if (count > 7) count = 7;

    for (var i = 0; i < count; i++) {
      enemies.push(createEnemy(waveNum, i));
    }
    updateHud();
    showWaveNotification('WAVE ' + waveNum);
  }

  function showWaveNotification(text) {
    waveNotif.textContent = text;
    waveNotif.classList.remove('show');
    // force reflow
    void waveNotif.offsetWidth;
    waveNotif.classList.add('show');
  }

  function initGame() {
    resize();
    player.x = W / 2;
    player.y = H - 180;
    player.hp = 100;
    player.vx = 0;
    player.vy = 0;

    score = 0;
    wave = 1;
    enemiesKilled = 0;
    particles = [];
    shakeTime = 0;

    spawnWave(1);
    updateHud();
    updateScoreHud();
  }

  function updateHud() {
    playerHpEl.style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
    // Hitung total HP musuh
    var totalHp = 0, totalMax = 0;
    for (var i = 0; i < enemies.length; i++) {
      totalHp += Math.max(0, enemies[i].hp);
      totalMax += enemies[i].maxHp;
    }
    var pct = totalMax > 0 ? (totalHp / totalMax * 100) : 0;
    enemyHpEl.style.width = pct + '%';
  }

  function updateScoreHud() {
    scoreValueEl.textContent = score;
    var alive = 0;
    for (var i = 0; i < enemies.length; i++) {
      if (enemies[i].hp > 0) alive++;
    }
    waveInfoEl.textContent = 'Wave ' + wave + ' • Musuh: ' + alive;
  }

  var input = { pointerActive: false, x: 0, y: 0, left: false, right: false };

  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }

  canvas.addEventListener('mousemove', function(e) {
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  }, { passive: false });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  }, { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') input.left = true;
    if (e.key === 'ArrowRight') input.right = true;
  });
  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft') input.left = false;
    if (e.key === 'ArrowRight') input.right = false;
  });

  function bindHold(btn, key) {
    function down(e) { e.preventDefault(); input[key] = true; }
    function up(e) { e.preventDefault(); input[key] = false; }
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
  }
  bindHold(document.getElementById('btnLeft'), 'left');
  bindHold(document.getElementById('btnRight'), 'right');

  function clampToArena(obj) {
    var m = arena.margin;
    if (obj.x < m) { obj.x = m; obj.vx = Math.abs(obj.vx) * 0.5; }
    if (obj.x > W - m) { obj.x = W - m; obj.vx = -Math.abs(obj.vx) * 0.5; }
    if (obj.y < m) { obj.y = m; obj.vy = Math.abs(obj.vy) * 0.5; }
    if (obj.y > H - m) { obj.y = H - m; obj.vy = -Math.abs(obj.vy) * 0.5; }
  }

  function updatePlayer(dt) {
    var speed = 380;
    var dirX = 0, dirY = 0;
    if (input.pointerActive) {
      var dx = input.x - player.x;
      var dy = input.y - player.y;
      var dist = Math.hypot(dx, dy);
      if (dist > 5) { dirX = dx / dist; dirY = dy / dist; }
    } else if (input.left) { dirX = -1; }
    else if (input.right) { dirX = 1; }

    player.vx += (dirX * speed - player.vx) * Math.min(1, dt * 8);
    player.vy += (dirY * speed * 0.6 - player.vy) * Math.min(1, dt * 8);
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    clampToArena(player);
    player.angle = Math.atan2(player.vy, player.vx) || player.angle;
  }

  function updateEnemy(e, dt) {
    if (e.hp <= 0) return;
    e.aiTimer -= dt;
    if (e.aiTimer <= 0) {
      e.aiTimer = 0.4 + Math.random() * 0.7;
      var margin = 80;
      var tX = player.x + (Math.random() - 0.5) * 80;
      var tY = player.y + (Math.random() - 0.5) * 80;
      if (e.x < margin) tX = W / 2;
      if (e.x > W - margin) tX = W / 2;
      if (e.y < margin) tY = H / 2 + 100;
      if (e.y > H - margin) tY = H / 2;
      e.targetX = tX;
      e.targetY = tY;
    }
    var dx = e.targetX - e.x;
    var dy = e.targetY - e.y;
    var dist = Math.hypot(dx, dy) || 1;
    e.vx += (dx / dist * e.speed - e.vx) * Math.min(1, dt * 4);
    e.vy += (dy / dist * e.speed - e.vy) * Math.min(1, dt * 4);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    clampToArena(e);
    e.angle = Math.atan2(e.vy, e.vx) || e.angle;
    if (e.hitFlash > 0) e.hitFlash -= dt;
  }

  function checkCollision() {
    var hitRadius = 42;

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.hp <= 0) continue;

      var dx = player.x - e.x;
      var dy = player.y - e.y;
      var dist = Math.hypot(dx, dy);

      if (dist < hitRadius && dist > 0) {
        var pSpeed = Math.hypot(player.vx, player.vy);
        var eSpeed = Math.hypot(e.vx, e.vy);
        var pDmg = eSpeed * 0.045;       // player kena damage dari musuh
        var eDmg = pSpeed * 0.06;        // musuh kena damage dari player

        // Bonus jika menyerang dari bawah
        if (player.y > e.y) pDmg *= 1.2;
        else eDmg *= 1.3;

        // Player sedikit lebih kuat
        eDmg *= 1.2;

        if (pDmg > 0.5) {
          player.hp -= pDmg;
          spawnParticles(player.x, player.y, '#F44336', 6);
          shakeTime = 0.15;
        }
        if (eDmg > 0.5) {
          e.hp -= eDmg;
          e.hitFlash = 0.15;
          spawnParticles(e.x, e.y, '#2196F3', 6);
        }

        // Pantulan
        var nx = dx / dist, ny = dy / dist;
        var overlap = hitRadius - dist;
        player.x += nx * overlap * 0.5;
        player.y += ny * overlap * 0.5;
        e.x -= nx * overlap * 0.5;
        e.y -= ny * overlap * 0.5;

        var pvx = player.vx, pvy = player.vy;
        player.vx = e.vx * 0.7 + nx * 100;
        player.vy = e.vy * 0.7 + ny * 100;
        e.vx = pvx * 0.7 - nx * 100;
