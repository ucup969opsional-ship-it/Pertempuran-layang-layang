<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Battle - Adu Layang-Layang</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #6ec6ff 0%, #b3e5fc 70%, #a5d6a7 100%);
    touch-action: none;
  }

  /* ===== INTRO SCREEN ===== */
  #introScreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: white;
    text-align: center;
    padding: 20px;
  }
  #introScreen.hidden { display: none; }

  .intro-kite {
    font-size: 80px;
    margin-bottom: 20px;
    opacity: 0;
    animation: kiteIn 0.8s ease-out 0.2s forwards;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7));
  }
  @keyframes kiteIn {
    0%   { opacity: 0; transform: translateY(-40px) rotate(-20deg) scale(0.5); }
    100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
  }

  .intro-title {
    font-size: 32px;
    font-weight: bold;
    color: #FFD700;
    letter-spacing: 4px;
    margin-bottom: 15px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.8s forwards;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
  }

  .intro-sub {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 2px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1.4s forwards;
  }

  .intro-credit {
    position: absolute;
    bottom: 60px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 2s forwards;
  }
  .intro-credit .label {
    display: block;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .intro-credit .names {
    font-size: 16px;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  }

  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .intro-start {
    margin-top: 20px;
    padding: 14px 36px;
    font-size: 16px;
    background: #FFD700;
    color: #333;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 2.6s forwards;
    box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
  }
  .intro-start:active { transform: scale(0.96); }

  /* HUD */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-weight: bold;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  #hud.visible { opacity: 1; }
  .hud-box {
    background: rgba(0,0,0,0.5);
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
  }
  .player-hud { border-left: 4px solid #2196F3; }
  .enemy-hud  { border-right: 4px solid #F44336; text-align: right; }
  .hp-bar {
    width: 110px;
    height: 8px;
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
    margin-top: 4px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    transition: width 0.2s;
  }
  .player-hud .hp-fill { background: #2196F3; }
  .enemy-hud .hp-fill  { background: #F44336; }

  /* Game Over Overlay */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  #overlay.visible { display: flex; }
  #overlay h1 { font-size: 32px; margin-bottom: 12px; color: #FFD700; }
  #overlay p { margin-bottom: 20px; font-size: 15px; line-height: 1.6; max-width: 400px; }
  #overlay button {
    padding: 12px 28px;
    font-size: 16px;
    background: #FFD700;
    color: #333;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay button:active { transform: scale(0.96); }

  /* Kontrol bawah */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 0 20px;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  #controls.visible { opacity: 1; }
  .ctrl-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.6);
    color: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    font-weight: bold;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.5); }

  .hint {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  .hint.visible { opacity: 1; }

  @media (max-width: 600px) {
    .intro-title { font-size: 24px; letter-spacing: 2px; }
    .intro-kite { font-size: 65px; }
    #overlay h1 { font-size: 24px; }
    #overlay p { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game"></canvas>

  <!-- ===== INTRO SCREEN ===== -->
  <div id="introScreen">
    <div class="intro-kite">🪁</div>
    <div class="intro-title">KITE BATTLE</div>
    <div class="intro-sub">Adu Layang-Layang</div>
    <button class="intro-start" id="startBtn">MULAI PERMAINAN</button>
    <div class="intro-credit">
      <span class="label">— CREATED BY —</span>
      <span class="names">Rinaldi, Dani G, Aliamsyah</span>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-box player-hud">
      🪁 KAMU
      <div class="hp-bar"><div class="hp-fill" id="playerHp"></div></div>
    </div>
    <div class="hud-box enemy-hud">
      MUSUH 🪁
      <div class="hp-bar"><div class="hp-fill" id="enemyHp"></div></div>
    </div>
  </div>

  <div class="hint" id="hint">Geser / sentuh untuk mengarahkan layanganmu</div>

  <div id="controls">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>

  <!-- Game Over Overlay -->
  <div id="overlay">
    <h1>🪁 KITE BATTLE 🪁</h1>
    <p>—</p>
    <button id="restartBtn">MAIN LAGI</button>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var introScreen = document.getElementById('introScreen');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var playerHpEl = document.getElementById('playerHp');
  var enemyHpEl = document.getElementById('enemyHp');
  var hud = document.getElementById('hud');
  var controls = document.getElementById('controls');
  var hint = document.getElementById('hint');

  var W = 0, H = 0;
  var dpr = window.devicePixelRatio || 1;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function() {
    resize();
    if (running) render();
  });
  resize();

  var running = false;
  var lastTime = 0;
  var particles = [];
  var shakeTime = 0;

  var player = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, angle: 0 };
  var enemy  = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, angle: 0, aiTimer: 0, targetX: 0, targetY: 0 };
  var arena = { margin: 40 };

  function initGame() {
    resize();
    player.x = W / 2;
    player.y = H - 180;
    player.hp = 100;
    player.vx = 0;
    player.vy = 0;

    enemy.x = W / 2 + (Math.random() - 0.5) * 200;
    enemy.y = 150;
    enemy.hp = 100;
    enemy.vx = 0;
    enemy.vy = 0;
    enemy.aiTimer = 0;

    particles = [];
    shakeTime = 0;
    updateHud();
  }

  function updateHud() {
    playerHpEl.style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
    enemyHpEl.style.width  = Math.max(0, enemy.hp / enemy.maxHp * 100) + '%';
  }

  var input = { pointerActive: false, x: 0, y: 0, left: false, right: false };

  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }

  canvas.addEventListener('mousemove', function(e) {
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  }, { passive: false });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  }, { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') input.left = true;
    if (e.key === 'ArrowRight') input.right = true;
  });
  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft') input.left = false;
    if (e.key === 'ArrowRight') input.right = false;
  });

  function bindHold(btn, key) {
    function down(e) { e.preventDefault(); input[key] = true; }
    function up(e) { e.preventDefault(); input[key] = false; }
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
  }
  bindHold(document.getElementById('btnLeft'), 'left');
  bindHold(document.getElementById('btnRight'), 'right');

  function clampToArena(obj) {
    var m = arena.margin;
    if (obj.x < m) { obj.x = m; obj.vx = Math.abs(obj.vx) * 0.5; }
    if (obj.x > W - m) { obj.x = W - m; obj.vx = -Math.abs(obj.vx) * 0.5; }
    if (obj.y < m) { obj.y = m; obj.vy = Math.abs(obj.vy) * 0.5; }
    if (obj.y > H - m) { obj.y = H - m; obj.vy = -Math.abs(obj.vy) * 0.5; }
  }

  function updatePlayer(dt) {
    var speed = 380;
    var dirX = 0, dirY = 0;
    if (input.pointerActive) {
      var dx = input.x - player.x;
      var dy = input.y - player.y;
      var dist = Math.hypot(dx, dy);
      if (dist > 5) { dirX = dx / dist; dirY = dy / dist; }
    } else if (input.left) { dirX = -1; }
    else if (input.right) { dirX = 1; }

    player.vx += (dirX * speed - player.vx) * Math.min(1, dt * 8);
    player.vy += (dirY * speed * 0.6 - player.vy) * Math.min(1, dt * 8);
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    clampToArena(player);
    player.angle = Math.atan2(player.vy, player.vx) || player.angle;
  }

  function updateEnemy(dt) {
    var speed = 300;
    enemy.aiTimer -= dt;
    if (enemy.aiTimer <= 0) {
      enemy.aiTimer = 0.5 + Math.random() * 0.8;
      var margin = 80;
      var tX = player.x + (Math.random() - 0.5) * 60;
      var tY = player.y + (Math.random() - 0.5) * 60;
      if (enemy.x < margin) tX = W / 2;
      if (enemy.x > W - margin) tX = W / 2;
      if (enemy.y < margin) tY = H / 2;
      if (enemy.y > H - margin) tY = H / 2;
      enemy.targetX = tX;
      enemy.targetY = tY;
    }
    var dx = enemy.targetX - enemy.x;
    var dy = enemy.targetY - enemy.y;
    var dist = Math.hypot(dx, dy) || 1;
    enemy.vx += (dx / dist * speed - enemy.vx) * Math.min(1, dt * 4);
    enemy.vy += (dy / dist * speed - enemy.vy) * Math.min(1, dt * 4);
    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;
    clampToArena(enemy);
    enemy.angle = Math.atan2(enemy.vy, enemy.vx) || enemy.angle;
  }

  function checkCollision() {
    var dx = player.x - enemy.x;
    var dy = player.y - enemy.y;
    var dist = Math.hypot(dx, dy);
    var hitRadius = 42;
    if (dist < hitRadius && dist > 0) {
      var pSpeed = Math.hypot(player.vx, player.vy);
      var eSpeed = Math.hypot(enemy.vx, enemy.vy);
      var pDmg = eSpeed * 0.04;
      var eDmg = pSpeed * 0.04;
      if (player.y > enemy.y) pDmg *= 1.3;
      else eDmg *= 1.3;
      pDmg *= 1.15;

      if (pDmg > 0.5) {
        player.hp -= pDmg;
        spawnParticles(player.x, player.y, '#F44336', 8);
        shakeTime = 0.15;
      }
      if (eDmg > 0.5) {
        enemy.hp -= eDmg;
        spawnParticles(enemy.x, enemy.y, '#2196F3', 8);
      }

      var nx = dx / dist, ny = dy / dist;
      var overlap = hitRadius - dist;
      player.x += nx * overlap * 0.5;
      player.y += ny * overlap * 0.5;
      enemy.x -= nx * overlap * 0.5;
      enemy.y -= ny * overlap * 0.5;

      var pvx = player.vx, pvy = player.vy;
      player.vx = enemy.vx * 0.7 + nx * 100;
      player.vy = enemy.vy * 0.7 + ny * 100;
      enemy.vx = pvx * 0.7 - nx * 100;
      enemy.vy = pvy * 0.7 - ny * 100;

      updateHud();
      if (player.hp <= 0 || enemy.hp <= 0) endGame();
    }
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 80 + Math.random() * 150;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.6, maxLife: 0.6, color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      p.vx *= 0.98;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6ec6ff');
    g.addColorStop(0.6, '#b3e5fc');
    g.addColorStop(1, '#c8e6c9');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    drawCloud(W * 0.2, H * 0.15, 50);
    drawCloud(W * 0.7, H * 0.25, 40);
    drawCloud(W * 0.45, H * 0.08, 35);

    ctx.fillStyle = 'rgba(255, 235, 100, 0.9)';
    ctx.beginPath();
    ctx.arc(W - 80, 80, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 150, 0.3)';
    ctx.beginPath();
    ctx.arc(W - 80, 80, 60, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCloud(x, y, r) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.arc(x + r * 0.8, y + 5, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x - r * 0.8, y + 5, r * 0.7, 0, Math.PI * 2);
    ctx.arc(x + r * 0.3, y - r * 0.5, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    var g = ctx.createLinearGradient(0, H - 60, 0, H);
    g.addColorStop(0, '#81c784');
    g.addColorStop(1, '#4caf50');
    ctx.fillStyle = g;
    ctx.fillRect(0, H - 60, W, 60);

    ctx.strokeStyle = '#388e3c';
    ctx.lineWidth = 2;
    for (var i = 0; i < W; i += 20) {
      ctx.beginPath();
      ctx.moveTo(i, H - 60);
      ctx.lineTo(i + 5, H - 70);
      ctx.stroke();
    }
  }

  function drawKite(obj, isPlayer) {
    var size = 26;
    var tilt = Math.sin(performance.now() / 300 + (isPlayer ? 0 : 1)) * 0.15;
    ctx.save();
    ctx.translate(obj.x, obj.y);
    ctx.rotate(tilt);

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(4, 6, size, size * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    var bg = ctx.createLinearGradient(-size, -size, size, size);
    if (isPlayer) {
      bg.addColorStop(0, '#64B5F6');
      bg.addColorStop(1, '#1565C0');
    } else {
      bg.addColorStop(0, '#EF5350');
      bg.addColorStop(1, '#B71C1C');
    }
    ctx.fillStyle = bg;
    ctx.strokeStyle = isPlayer ? '#0D47A1' : '#7f0000';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.75, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.75, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -size); ctx.lineTo(0, size);
    ctx.moveTo(-size * 0.75, 0); ctx.lineTo(size * 0.75, 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.strokeStyle = isPlayer ? '#1565C0' : '#B71C1C';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, size);
    var wave = Math.sin(performance.now() / 150 + (isPlayer ? 0 : 2)) * 8;
    ctx.quadraticCurveTo(wave, size + 15, wave * 0.5, size + 30);
    ctx.stroke();

    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(wave * 0.5, size + 28, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawString() {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(player.x, H);
    ctx.lineTo(player.x, player.y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(enemy.x, 0);
    ctx.lineTo(enemy.x, enemy.y);
    ctx.stroke();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shakeTime > 0) {
      var s = shakeTime * 20;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    drawSky();
    drawString();
    drawGround();
    drawKite(enemy, false);
    drawKite(player, true);
    drawParticles();
    ctx.restore();
  }

  function loop(time) {
    if (!running) return;
    var dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    if (shakeTime > 0) shakeTime -= dt;

    updatePlayer(dt);
    updateEnemy(dt);
    checkCollision();
    updateParticles(dt);
    render();
    requestAnimationFrame(loop);
  }

  function startGame() {
    introScreen.classList.add('hidden');
    overlay.classList.remove('visible');
    hud.classList.add('visible');
    controls.classList.add('visible');
    hint.classList.add('visible');
    initGame();
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    var playerWin = enemy.hp <= 0;
    overlay.classList.add('visible');
    overlay.querySelector('h1').textContent = playerWin ? '🏆 KAMU MENANG!' : '💥 KAMU KALAH!';
    overlay.querySelector('p').innerHTML = playerWin
      ? 'Kamu berhasil memutus benang layang-layang lawan! 🪁✂️<br><br>Main lagi?'
      : 'Benang layanganmu putus! Lawan menang. 😢<br><br>Coba lagi?';
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
})();
</script>
</body>
  </html>
